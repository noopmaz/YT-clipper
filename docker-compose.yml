version: '3.9'

services:
  yt-clipper:
    build:
      context: .
      dockerfile: Dockerfile
    image: yt-clipper:latest
    container_name: yt-clipper
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - TEMP_DIR=/tmp/yt-clipper
      - FILE_TTL_MINUTES=30
      - MAX_VIDEO_DURATION=1800
      - RATE_LIMIT_RPM=10
      - MAX_CONCURRENT_JOBS=3
      - MAX_STORAGE_BYTES=524288000
      - LOG_LEVEL=info
      # Uncomment and set your secret:
      # - JOB_SECRET=your-secret-here
      # Optional proxy for yt-dlp:
      # - YTDLP_PROXY=socks5://proxy:1080
    volumes:
      - yt-clipper-tmp:/tmp/yt-clipper
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  yt-clipper-tmp:
    driver: local

networks:
  default:
    name: yt-clipper-net
